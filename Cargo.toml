[package]
name = "arach-package-lint"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SisyphusAeolides/Arach-Packages"
description = "Recipe and immutable source-lock validator for Arach OS"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.12"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arach-package-lint"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
