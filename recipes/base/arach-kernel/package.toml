format = 1

[package]
name = "arach-kernel"
version = "0.1.0"
release = 10
summary = "Arach monolithic kernel"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-Kernel.git"
revision = "615b6e81fa48dac6ce40be9112dceee08494a3c6"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features kernel-bin"]
outputs = ["target/release/arach"]

[runtime]
provides = ["arach-kernel", "arach-driver-abi"]

[policy]
network = false
sandbox = true
reproducible = true
