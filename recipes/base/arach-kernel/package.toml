format = 1

[package]
name = "arach-kernel"
version = "0.1.0"
release = 32
summary = "Arach monolithic kernel"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-Kernel.git"
revision = "5a74a3d222d14e61beb32427228c91b2a40411c6"
submodules = false

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Push.git"
revision = "5bd361b86c048b60b6a8422a8e173ea0ec867bff"
submodules = false

[build]
system = "custom"
commands = ["cargo build-kernel-package"]
outputs = ["target/package-kernel/x86_64-arach/release/arach"]

[runtime]
provides = ["arach-kernel", "arach-driver-abi"]

[policy]
network = false
sandbox = true
reproducible = true
