format = 1

[package]
name = "granite"
version = "0.1.0"
release = 2
summary = "Measured UEFI bootloader for Arach OS"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Granite.git"
revision = "cb6fc0f5d0b5494d2ae8997b71c410cd33016be7"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --target x86_64-unknown-uefi --features uefi-bin,require-artifacts"]
outputs = ["target/x86_64-unknown-uefi/release/granite.efi"]

[runtime]
depends = ["arach-kernel", "push"]
provides = ["uefi-bootloader"]

[policy]
network = false
sandbox = true
reproducible = true
