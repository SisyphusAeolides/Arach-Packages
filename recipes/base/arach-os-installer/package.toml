format = 1

[package]
name = "arach-os-installer"
version = "0.1.0"
release = 17
summary = "Journaled Arach OS installer transaction and Calamares integration"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-OS.git"
revision = "9d483c753f3c89f47afcc6033769eb169f303ab9"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --bin arach-install"]
outputs = [
  "target/release/arach-install",
  "branding/arach-logo.png",
  "installer/calamares/settings.conf",
  "installer/calamares/branding/arach/branding.desc",
  "installer/calamares/modules/arach-hardware.conf",
  "installer/calamares/modules/arach-prepare.conf",
  "installer/calamares/modules/arach-commit.conf",
  "installer/calamares/modules/partition.conf",
  "installer/calamares/modules/users.conf",
  "installer/calamares/modules/unpackfs.conf",
  "installer/calamares/modules/arachhardware/module.desc",
  "installer/calamares/modules/arachhardware/main.py",
  "installer/calamares/modules/arachtransaction/module.desc",
  "installer/calamares/modules/arachtransaction/main.py",
  "installer/calamares/modules/arachtransaction/protocol.py",
]

[runtime]
depends = ["corinth", "arach-hwd", "calamares"]
provides = ["arach-install", "arach-branding", "arach-calamares-integration"]

[policy]
network = false
sandbox = true
reproducible = true
