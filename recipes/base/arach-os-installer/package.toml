format = 1

[package]
name = "arach-os-installer"
version = "0.1.0"
release = 1
summary = "Journaled Arach OS installer transaction and canonical branding"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-OS.git"
revision = "621d219145a87dadb214e2bbbb726d2dfa26f39c"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --bin arach-install"]
outputs = [
  "target/release/arach-install",
  "branding/arach-logo.png",
]

[runtime]
depends = ["corinth", "arach-hwd"]
provides = ["arach-install", "arach-branding"]

[policy]
network = false
sandbox = true
reproducible = true
