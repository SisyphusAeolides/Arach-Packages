format = 1

[package]
name = "arach-hwd"
version = "0.1.0"
release = 24
summary = "Signed hardware detection, qualification, and provisioning for Arach OS"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-HWD.git"
revision = "9bf30a8986394d3e1881d860d31680baa46203d8"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features fortran-ranking"]
outputs = [
  "target/release/arach-hwd",
  "target/release/arach-hwd-catalog-sync",
  "target/release/arach-hwd-qualify",
]

[runtime]
depends = ["corinth"]
provides = [
  "hardware-detection",
  "hardware-provisioning",
  "signed-hardware-catalog-sync",
  "hardware-qualification",
]

[policy]
network = false
sandbox = true
reproducible = true
