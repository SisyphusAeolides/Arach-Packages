format = 1

[package]
name = "arach-hwd"
version = "0.1.0"
release = 21
summary = "Signed hardware detection, remote catalogs, and provisioning for Arach OS"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Arach-HWD.git"
revision = "569c40a530fb8e5fe9fc618b97c7ae4a5795f634"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features fortran-ranking"]
outputs = [
  "target/release/arach-hwd",
  "target/release/arach-hwd-catalog-sync",
]

[runtime]
depends = ["corinth"]
provides = [
  "hardware-detection",
  "hardware-provisioning",
  "signed-hardware-catalog-sync",
]

[policy]
network = false
sandbox = true
reproducible = true
