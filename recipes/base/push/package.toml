format = 1

[package]
name = "push"
version = "0.1.0"
release = 8
summary = "Measured Arach PID 1 and service supervisor"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Push.git"
revision = "74b8db4640401c367fcfd1a6a9ba5f3fddd3860b"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features os-bin,cosmic-boot"]
outputs = ["target/release/push"]

[runtime]
depends = ["slope"]
provides = ["pid-1", "service-supervisor", "ordered-session-shutdown"]

[policy]
network = false
sandbox = true
reproducible = true
