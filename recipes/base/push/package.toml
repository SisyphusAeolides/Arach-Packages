format = 1

[package]
name = "push"
version = "0.1.0"
release = 6
summary = "Measured Arach PID 1 and service supervisor"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Push.git"
revision = "b19d286e15baec0fd418697c5a126bd3b541befc"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features os-bin,cosmic-boot"]
outputs = ["target/release/push"]

[runtime]
depends = ["slope"]
provides = ["pid-1", "service-supervisor"]

[policy]
network = false
sandbox = true
reproducible = true
