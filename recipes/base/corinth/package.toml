format = 1

[package]
name = "corinth"
version = "0.1.0"
release = 18
summary = "Transactional package manager for Arach OS"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Corinth.git"
revision = "37829f6d05aa292f190a1c2ce659372d97b3fd14"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked --features os-bin"]
outputs = ["target/release/corinth"]

[runtime]
depends = ["slope"]
provides = ["package-manager"]

[policy]
network = false
sandbox = true
reproducible = true
