format = 1

[package]
name = "slope"
version = "0.1.0"
release = 6
summary = "Arach capability-oriented userspace ABI"
license = "MIT"
scope = "system"
publish_authority = "arach-native"
architectures = ["x86-64"]

[[source]]
kind = "git"
url = "https://github.com/SisyphusAeolides/Slope.git"
revision = "b3decb53e71bb3c5d5fc55047451bcf9cef7eff9"
submodules = false

[build]
system = "cargo"
commands = ["cargo build --release --locked"]
outputs = ["target/release/libslope.rlib"]

[runtime]
depends = ["arach-kernel"]
provides = ["arach-userspace-abi"]

[policy]
network = false
sandbox = true
reproducible = true
