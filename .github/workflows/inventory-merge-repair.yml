name: Inventory merge repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-merge-repair.yml

permissions:
  contents: write

concurrency:
  group: inventory-merge-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair merge invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/merge_recipe_inventories.py')
          text = path.read_text(encoding='utf-8')

          old = '''            or architecture not in {"x86-64", "aarch64", "riscv64"}
            or strategy not in STRATEGIES
        ):
            raise MergeError(f"{base} package identity or strategy is invalid")
'''
          new = '''            or architecture != "x86-64"
            or strategy not in STRATEGIES
        ):
            raise MergeError(
                f"{base} package identity, architecture, or strategy is invalid"
            )
'''
          if text.count(old) != 1:
              raise SystemExit('entry architecture block differs')
          text = text.replace(old, new)

          old = '''    if len(merged) > MAX_ENTRIES:
        raise MergeError("merged corpus exceeds bounded capacity")
'''
          new = '''    if len(merged) > MAX_ENTRIES:
        raise MergeError("merged corpus exceeds bounded capacity")
    if len(merged) > TARGET:
        raise MergeError("merged corpus exceeds the production target")
'''
          if text.count(old) != 1:
              raise SystemExit('merged capacity block differs')
          text = text.replace(old, new)

          old = '''        "manifest_sha256": hashlib.sha256(
            (json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\\n").encode("utf-8")
        ).hexdigest(),
'''
          new = '''        "manifest_sha256": hashlib.sha256(json_bytes(manifest)).hexdigest(),
'''
          if text.count(old) != 1:
              raise SystemExit('manifest digest block differs')
          text = text.replace(old, new)

          old = '''def write_new(path: Path, value: dict[str, Any]) -> None:
    if path.exists() or path.is_symlink():
        raise MergeError(f"output path must be new: {path}")
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
'''
          new = '''def json_bytes(value: dict[str, Any]) -> bytes:
    return (json.dumps(value, indent=2, sort_keys=True) + "\\n").encode("utf-8")


def write_new(path: Path, value: dict[str, Any]) -> None:
    if path.exists() or path.is_symlink():
        raise MergeError(f"output path must be new: {path}")
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_bytes(json_bytes(value))
'''
          if text.count(old) != 1:
              raise SystemExit('write_new block differs')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_merge_recipe_inventories.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''        self.assertEqual(report["authorization"], "unsigned-package-index-manifest")
'''
          addition = '''        self.assertEqual(
            report["manifest_sha256"],
            MODULE.hashlib.sha256(MODULE.json_bytes(manifest)).hexdigest(),
        )
'''
          if test_text.count(marker) != 1:
              raise SystemExit('manifest digest test marker differs')
          tests.write_text(test_text.replace(marker, marker + addition), encoding='utf-8')

          Path('.github/workflows/inventory-merge-repair.yml').unlink()
          stale = Path('.github/workflows/inventory-merge-fix.yml')
          if stale.exists():
              stale.unlink()
          PY
      - name: Validate repaired merge
        run: |
          python3 -m unittest \
            tests/test_upstream_coverage.py \
            tests/test_merge_recipe_inventories.py
          python3 -m py_compile scripts/merge_recipe_inventories.py
          git diff --check
      - name: Commit merge repair
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden multi-upstream corpus merge'
          git pull --rebase origin main
          git push origin HEAD:main
