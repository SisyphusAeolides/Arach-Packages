          marker = '''fn validate_build_commands(build: &Build) -> Result<(), ValidationError> {'''
          if text.count(marker) != 1:
              raise SystemExit('build command marker differs')
          cargo_validation = r'''#[derive(Debug, Deserialize)]
#[serde(deny_unknown_fields)]
struct CargoLockDocument {
    version: u32,
    #[serde(default)]
    package: Vec<CargoLockPackage>,
}

#[derive(Debug, Deserialize)]
#[serde(deny_unknown_fields)]
struct CargoLockPackage {
    name: String,
    version: String,
    #[serde(default)]
    source: Option<String>,
    #[serde(default)]
    checksum: Option<String>,
    #[serde(default)]
    dependencies: Vec<String>,
}

fn validate_cargo_closure(recipe: &Recipe) -> Result<(), ValidationError> {
    let crate_sources = recipe
        .source
        .iter()
        .filter(|source| source.kind == SourceKind::CratesIo)
        .collect::<Vec<_>>();
    let Some(closure) = recipe.cargo_closure.as_ref() else {
        if crate_sources.is_empty() {
            return Ok(());
        }
        return Err(ValidationError::new(
            "cargo_closure",
            "crates.io recipes require a complete Cargo.lock closure",
        ));
    };
    if recipe.build.system != BuildSystem::Cargo
        || recipe.policy.network
        || recipe.build.commands.is_empty()
        || recipe.build.commands.iter().any(|command| {
            !command
                .split_ascii_whitespace()
                .any(|word| word == "--locked")
        })
    {
        return Err(ValidationError::new(
            "cargo_closure",
            "Cargo closures require offline cargo commands with --locked",
        ));
    }
    if closure.lock.is_empty() || closure.lock.len() > 4 * 1024 * 1024 {
        return Err(ValidationError::new(
            "cargo_closure.lock",
            "Cargo.lock is empty or exceeds the byte bound",
        ));
    }
    let lock: CargoLockDocument = toml::from_str(&closure.lock).map_err(|error| {
        ValidationError::new("cargo_closure.lock", error.to_string())
    })?;
    if !matches!(lock.version, 3 | 4) || lock.package.is_empty() {
        return Err(ValidationError::new(
            "cargo_closure.lock",
            "unsupported or empty Cargo.lock",
        ));
    }
    let mut root_count = 0_usize;
    let mut locked = Vec::new();
    for package in lock.package {
        if package.name == recipe.package.name
            && package.version == recipe.package.version
            && package.source.is_none()
        {
            root_count += 1;
            continue;
        }
        let source = package.source.ok_or_else(|| {
            ValidationError::new(
                "cargo_closure.lock",
                "Cargo.lock contains a non-root path or Git dependency",
            )
        })?;
        if source != "registry+https://github.com/rust-lang/crates.io-index"
            || package
                .dependencies
                .iter()
                .any(|dependency| dependency.trim().is_empty())
        {
            return Err(ValidationError::new(
                "cargo_closure.lock",
                "Cargo.lock contains a non-crates.io dependency",
            ));
        }
        let checksum = package.checksum.ok_or_else(|| {
            ValidationError::new(
                "cargo_closure.lock",
                "Cargo registry checksum is missing",
            )
        })?;
        validate_cargo_package_identity(&package.name, &package.version, &checksum)?;
        locked.push(CargoPackage {
            name: package.name,
            version: package.version,
            checksum,
        });
    }
    locked.sort();
    if root_count != 1
        || closure.packages.windows(2).any(|pair| pair[0] >= pair[1])
        || locked != closure.packages
    {
        return Err(ValidationError::new(
            "cargo_closure.packages",
            "declared package closure does not match Cargo.lock",
        ));
    }
    for package in &closure.packages {
        validate_cargo_package_identity(&package.name, &package.version, &package.checksum)?;
    }
    let root_sources = crate_sources
        .iter()
        .filter(|source| {
            source.package.as_deref() == Some(recipe.package.name.as_str())
                && source.version.as_deref() == Some(recipe.package.version.as_str())
                && source.destination.is_none()
        })
        .count();
    if root_sources != 1 || crate_sources.len() != closure.packages.len() + 1 {
        return Err(ValidationError::new(
            "source",
            "crates.io source count differs from Cargo closure",
        ));
    }
    for package in &closure.packages {
        let expected_destination = format!(
            ".corinth-vendor/{}-{}",
            package.name, package.version
        );
        if !crate_sources.iter().any(|source| {
            source.package.as_deref() == Some(package.name.as_str())
                && source.version.as_deref() == Some(package.version.as_str())
                && source.checksum.as_deref() == Some(package.checksum.as_str())
                && source.destination.as_deref() == Some(expected_destination.as_str())
        }) {
            return Err(ValidationError::new(
                "source",
                format!(
                    "crates.io source is missing or misplaced: {} {}",
                    package.name, package.version
                ),
            ));
        }
    }
    Ok(())
}

fn validate_cargo_package_identity(
    name: &str,
    version: &str,
    checksum: &str,
) -> Result<(), ValidationError> {
    if name.is_empty()
        || name.len() > 128
        || !name.bytes().all(|byte| {
            byte.is_ascii_lowercase()
                || byte.is_ascii_digit()
                || matches!(byte, b'-' | b'_')
        })
        || version.is_empty()
        || version.len() > 256
        || version.bytes().any(|byte| {
            byte.is_ascii_control()
                || byte.is_ascii_whitespace()
                || matches!(byte, b'/' | b'\' | b'@')
        })
        || checksum.len() != 64
        || !checksum
            .bytes()
            .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))
    {
        return Err(ValidationError::new(
            "cargo_closure.packages",
            "Cargo package identity or checksum is invalid",
        ));
    }
    Ok(())
}

fn validate_source_destination(path: &str, value: &str) -> Result<(), ValidationError> {
    let candidate = Path::new(value);
    if value.is_empty()
        || value.len() > 4096
        || candidate.is_absolute()
        || value.contains('\')
        || value
            .split('/')
            .any(|component| component.is_empty() || component == "." || component == "..")
    {
        return Err(ValidationError::new(
            path,
            "source destination must be a safe relative path",
        ));
    }
    Ok(())
}

