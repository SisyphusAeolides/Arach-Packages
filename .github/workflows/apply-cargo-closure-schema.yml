name: Apply Cargo closure schema

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-cargo-closure-schema.yml

permissions:
  contents: write

concurrency:
  group: apply-cargo-closure-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extend canonical recipe schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count}, found {actual}: {old[:100]!r}')
              text = text.replace(old, new)

          replace(
              '''    pub policy: Policy,
    pub hardware: Option<Hardware>,
}''',
              '''    pub policy: Policy,
    #[serde(default)]
    pub cargo_closure: Option<CargoClosure>,
    pub hardware: Option<Hardware>,
}''',
          )
          replace(
              '''    pub version: Option<String>,
    #[serde(default)]
    pub submodules: bool,
}''',
              '''    pub version: Option<String>,
    #[serde(default)]
    pub destination: Option<String>,
    #[serde(default)]
    pub submodules: bool,
}''',
          )
          replace(
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq)]
#[serde(deny_unknown_fields)]
pub struct Build {''',
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq)]
#[serde(deny_unknown_fields)]
