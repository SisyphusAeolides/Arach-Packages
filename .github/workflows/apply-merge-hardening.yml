name: Apply corpus merge hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-merge-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-corpus-merge-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply deterministic source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/merge_recipe_inventories.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'or architecture not in {"x86-64", "aarch64", "riscv64"}',
                  'or architecture != "x86-64"',
              ),
              (
                  'raise MergeError(f"{base} package identity or strategy is invalid")',
                  'raise MergeError(\n'
                  '                f"{base} package identity, architecture, or strategy is invalid"\n'
                  '            )',
              ),
              (
                  '    if len(merged) > MAX_ENTRIES:\n'
                  '        raise MergeError("merged corpus exceeds bounded capacity")\n',
                  '    if len(merged) > MAX_ENTRIES:\n'
                  '        raise MergeError("merged corpus exceeds bounded capacity")\n'
                  '    if len(merged) > TARGET:\n'
                  '        raise MergeError("merged corpus exceeds the production target")\n',
              ),
              (
                  '        "manifest_sha256": hashlib.sha256(\n'
                  '            (json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\\n").encode("utf-8")\n'
                  '        ).hexdigest(),\n',
                  '        "manifest_sha256": hashlib.sha256(json_bytes(manifest)).hexdigest(),\n',
              ),
              (
                  'def write_new(path: Path, value: dict[str, Any]) -> None:\n'
                  '    if path.exists() or path.is_symlink():\n'
                  '        raise MergeError(f"output path must be new: {path}")\n'
                  '    path.parent.mkdir(parents=True, exist_ok=True)\n'
                  '    path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\\n", encoding="utf-8")\n',
                  'def json_bytes(value: dict[str, Any]) -> bytes:\n'
                  '    return (json.dumps(value, indent=2, sort_keys=True) + "\\n").encode("utf-8")\n\n\n'
                  'def write_new(path: Path, value: dict[str, Any]) -> None:\n'
                  '    if path.exists() or path.is_symlink():\n'
                  '        raise MergeError(f"output path must be new: {path}")\n'
                  '    path.parent.mkdir(parents=True, exist_ok=True)\n'
                  '    path.write_bytes(json_bytes(value))\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one merge source marker: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_merge_recipe_inventories.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '        self.assertEqual(report["authorization"], "unsigned-package-index-manifest")\n'
          addition = (
              '        self.assertEqual(\n'
              '            report["manifest_sha256"],\n'
              '            MODULE.hashlib.sha256(MODULE.json_bytes(manifest)).hexdigest(),\n'
              '        )\n'
          )
          if tests.count(marker) != 1:
              raise SystemExit('manifest digest test marker differs')
          test_path.write_text(tests.replace(marker, marker + addition), encoding='utf-8')

          Path('.github/workflows/apply-merge-hardening.yml').unlink()
          stale = Path('.github/workflows/inventory-merge-fix.yml')
          if stale.exists():
              stale.unlink()
          PY
          python3 -m py_compile scripts/merge_recipe_inventories.py
          git diff --check
      - name: Commit source hardening
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden multi-upstream corpus merge'
          git pull --rebase origin main
          git push origin HEAD:main
