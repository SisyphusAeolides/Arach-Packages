name: Extract CachyOS meta candidates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-meta-candidates.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract retained meta records
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          revision = '8753877a6ed4af2bf510b8b3f5bda88b793f28ec'
          source = pathlib.Path('ingress/cachyos/snapshots') / f'{revision}.records.json'
          records = json.loads(source.read_text(encoding='utf-8'))
          selected = [
              {
                  'path': record['path'],
                  'packages': record['packages'],
                  'pkgbuild_sha256': record['pkgbuild_sha256'],
                  'srcinfo_sha256': record['srcinfo_sha256'],
                  'reason_codes': record['reason_codes'],
                  'signals': record['signals'],
              }
              for record in records['records']
              if record['admission_class'] == 'meta'
          ]
          output_count = sum(len(record['packages']) for record in selected)
          if output_count != 2:
              raise SystemExit(f'expected two meta outputs, found {output_count}')
          document = {
              'format': 1,
              'repository': records['repository'],
              'revision': records['revision'],
              'output_count': output_count,
              'records': selected,
          }
          destination = pathlib.Path('ingress/cachyos/meta-candidates.json')
          destination.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n')
          pathlib.Path('.github/workflows/extract-meta-candidates.yml').unlink()
          PY
          git diff --check
      - name: Commit meta candidates
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'data: retain CachyOS meta candidates'
          git pull --rebase origin main
          git push origin HEAD:main
