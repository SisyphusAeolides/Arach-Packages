name: Inventory merge validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inventory-merge-fix.yml

permissions:
  contents: write

concurrency:
  group: inventory-merge-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bind merge to x86-64 corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/merge_recipe_inventories.py')
          text = path.read_text(encoding='utf-8')
          old = '''            or architecture not in {"x86-64", "aarch64", "riscv64"}
            or strategy not in STRATEGIES
'''
          new = '''            or architecture != "x86-64"
            or strategy not in STRATEGIES
'''
          if text.count(old) != 1:
              raise SystemExit('architecture validation block differs')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/inventory-merge-fix.yml').unlink()
          PY
      - name: Run policy tests
        run: |
          python3 -m unittest \
            tests/test_upstream_coverage.py \
            tests/test_merge_recipe_inventories.py
          python3 scripts/validate_upstream_coverage.py \
            --coverage production/upstream-coverage.json
          python3 -m py_compile \
            scripts/validate_upstream_coverage.py \
            scripts/merge_recipe_inventories.py \
            tests/test_upstream_coverage.py \
            tests/test_merge_recipe_inventories.py
          git diff --check
      - name: Commit merge validation
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind corpus merge to x86-64'
          git pull --rebase origin main
          git push origin HEAD:main
