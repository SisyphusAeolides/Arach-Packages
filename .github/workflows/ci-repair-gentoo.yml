name: Repair Gentoo classifier CI

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_gentoo_classifier.py
      - .github/workflows/ci-repair-gentoo.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply Gentoo repair
        run: |
          python3 scripts/repair_gentoo_classifier.py
          rm scripts/repair_gentoo_classifier.py
          git diff --check
      - name: Validate Gentoo repair
        run: |
          python3 -m unittest tests/test_inventory_gentoo_ebuild_shard.py
          python3 -m py_compile scripts/inventory_gentoo_ebuild_shard.py
      - name: Commit repaired classifier
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add scripts/inventory_gentoo_ebuild_shard.py scripts/repair_gentoo_classifier.py
          git commit -m 'fix: repair Gentoo ebuild classification'
          git pull --rebase origin main
          git push origin HEAD:main
