name: Corpus upstream migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corpus-upstream-migration.yml

permissions:
  contents: write

concurrency:
  group: corpus-upstream-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add CachyOS corpus provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'production/recipe-corpus-plan.json',
              '"distribution": "Arach OS"',
              '"distribution": "ArachOS"',
          )
          replace(
              'production/recipe-corpus-plan.json',
              '    "aur",\n    "fedora",',
              '    "aur",\n    "cachyos",\n    "fedora",',
          )
          replace(
              'scripts/validate_recipe_corpus.py',
              '    "aur",\n    "fedora",',
              '    "aur",\n    "cachyos",\n    "fedora",',
          )
          replace(
              'scripts/validate_recipe_corpus.py',
              'plan["distribution"] != "Arach OS"',
              'plan["distribution"] != "ArachOS"',
          )
          replace(
              'scripts/validate_recipe_corpus.py',
              'manifest["distribution"] != "Arach OS"',
              'manifest["distribution"] != "ArachOS"',
          )
          Path('.github/workflows/corpus-upstream-migration.yml').unlink()
          PY
      - name: Validate corpus plan
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys

          path = pathlib.Path('scripts/validate_recipe_corpus.py')
          spec = importlib.util.spec_from_file_location('validate_recipe_corpus', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load corpus validator')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          plan = json.loads(pathlib.Path('production/recipe-corpus-plan.json').read_text())
          module.validate_plan(plan)
          if module.UPSTREAMS != [
              'arch', 'aur', 'cachyos', 'fedora', 'debian', 'alpine',
              'gentoo', 'crux', 'nix', 'cargo', 'github'
          ]:
              raise SystemExit('corpus upstream order differs')
          PY
          python3 -m py_compile scripts/validate_recipe_corpus.py scripts/build_recipe_corpus_shard.py
          git diff --check
      - name: Commit corpus migration
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add CachyOS corpus provenance'
          git pull --rebase origin main
          git push origin HEAD:main
