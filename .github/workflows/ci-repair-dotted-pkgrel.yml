name: Repair dotted package release handling

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_dotted_pkgrel.py
      - .github/workflows/ci-repair-dotted-pkgrel.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply dotted release repair
        run: |
          python3 scripts/repair_dotted_pkgrel.py
          rm scripts/repair_dotted_pkgrel.py
          git diff --check
      - name: Validate release encoding
        run: |
          python3 -m unittest scripts/test_prepare_cachyos_overlay.py
          python3 -m py_compile scripts/prepare_cachyos_overlay.py
      - name: Commit repaired release mapping
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add scripts/prepare_cachyos_overlay.py scripts/test_prepare_cachyos_overlay.py scripts/repair_dotted_pkgrel.py
          git commit -m 'fix: encode dotted package releases'
          git pull --rebase origin main
          git push origin HEAD:main
